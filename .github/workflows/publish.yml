name: Publish release

on:
  push:
    branches: [builds]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release new zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for zip in PanelAttack-miyoo-v*.zip; do
            [ -f "$zip" ] || continue
            v="${zip#PanelAttack-miyoo-v}"; v="${v%.zip}"; tag="v$v"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released"; continue
            fi
            notes="notes-$tag.md"
            [ -f "$notes" ] || { echo "::error::missing $notes"; exit 1; }
            gh release create "$tag" "$zip" sources/* --target main \
              --title "Panel Attack for Miyoo Mini Plus $tag" --notes-file "$notes"
          done
          # source code the license requires next to each release (LGPL: OpenAL Soft)
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            have=$(gh release view "$tag" --json assets --jq '.assets[].name')
            for f in sources/*; do
              echo "$have" | grep -qx "$(basename "$f")" || gh release upload "$tag" "$f"
            done
          done
